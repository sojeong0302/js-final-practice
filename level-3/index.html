<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="./css/reset.css" />
    <link rel="stylesheet" href="./css/index.css" />
  </head>
  <body class="body-container">
    <header class="header-container">
      <h1 class="header-logo">Spending</h1>
    </header>
    <main class="main-container">
      <form class="add-section">
        <div class="title-container"><p class="title">지출</p></div>
        <div class="category">
          <p class="subtitle">카테고리</p>
          <select class="select" id="add_select">
            <option id="life">카테고리 선택</option>
            <option id="life">생활</option>
            <option id="move">이동</option>
            <option id="livingExpenses">생활비</option>
            <option id="consumption">소비</option>
            <option id="individual">개인</option>
            <option id="etc">기타</option>
          </select>
        </div>
        <div class="category">
          <p class="subtitle">설명</p>
          <input
            class="add-input"
            id="des_input"
            placeholder="추가할 항목을 입력해주세요"
          />
        </div>
        <div class="category">
          <p class="subtitle">비용</p>
          <input
            class="add-input"
            id="amount_input"
            placeholder="추가할 항목을 입력해주세요"
          />
        </div>
        <button class="add-button" type="submit">추가</button>
      </form>
      <section class="list-section">
        <div class="title-container"><p class="title">목록</p></div>
        <select class="select" id="filter_select">
          <option>카테고리 선택</option>
          <option value="생활">생활</option>
          <option value="이동">이동</option>
          <option value="소비">소비</option>
          <option value="개인">개인</option>
        </select>
        <select class="select" id="amount_select">
          <option>금액순</option>
          <option value="ascending">오름차순</option>
          <option value="descending">내림차순</option>
        </select>
        <select class="select" id="date_select">
          <option>날짜순</option>
          <option value="upToDate">최신순</option>
          <option value="downToDate">오래된순</option>
        </select>
        <ul class="spending-list"></ul>
      </section>
      <section class="stats-section">
        <div class="title-container">
          <p class="title">통계</p>
        </div>
        <ul class="stats-list"></ul>
      </section>
    </main>
    <footer class="footer-container">
      <p class="copyright">ⓒ 2026 FS-sprint (12기) All rights reserved</p>
    </footer>
    <script type="module" src="./js/render/list.js"></script>
    <script type="module" src="./js/render/stats.js"></script>
    <script type="module" src="./js/main.js"></script>
  </body>
</html>
